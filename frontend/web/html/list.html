<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои генерации — ГОСТ Отчёт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #00674F;
            --green-dark: #004d3b;
            --green-light: #E6F4F0;
            --black: #0B0B0B;
            --white: #FFFFFF;
            --gray: #F5F5F5;
            --border-w: 2px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .btn {
            display: inline-block;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 12px 28px;
            border: var(--border-w) solid var(--black);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--black);
            background: var(--white);
            text-align: center;
            font-family: inherit;
            border-radius: 0;
        }

        .btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .btn-primary {
            background: var(--green);
            color: var(--white);
            border-color: var(--green);
        }

        .btn-primary:hover {
            background: var(--green-dark);
            border-color: var(--green-dark);
            color: var(--white);
        }

        .btn-small {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .tag {
            display: inline-block;
            background: var(--green);
            color: var(--white);
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 14px;
            border: var(--border-w) solid var(--black);
            margin-bottom: 16px;
        }

        .icon-btn {
            background: transparent;
            border: var(--border-w) solid var(--black);
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            color: var(--black);
            background: var(--white);
            text-decoration: none;
            border-radius: 0;
        }

        .icon-btn:hover {
            background: var(--green-light);
        }

        .icon-btn.danger:hover {
            background: #FFD6D6;
        }

        .navbar {
            padding: 20px 0;
            border-bottom: var(--border-w) solid var(--black);
            background: var(--white);
            flex-shrink: 0;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--black);
        }

        .logo-box {
            display: inline-block;
            background: var(--green);
            color: var(--white);
            padding: 2px 12px;
            border: var(--border-w) solid var(--black);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links a {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--black);
            padding: 6px 14px;
            border: var(--border-w) solid transparent;
            transition: 0.15s;
            letter-spacing: 0.02em;
        }

        .nav-links a:hover {
            border-color: var(--green);
            background: var(--green-light);
        }

        .nav-links .btn {
            padding: 6px 18px;
            font-size: 0.75rem;
        }

        .history-page {
            flex: 1;
            padding: 40px 0 60px;
            background: var(--gray);
            border-top: var(--border-w) solid var(--black);
            border-bottom: var(--border-w) solid var(--black);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .history-header h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .history-header h1 span {
            background: var(--green);
            color: var(--white);
            padding: 0 8px;
        }

        .history-list {
            background: var(--white);
            border: var(--border-w) solid var(--black);
            overflow: hidden;
        }

        .history-item {
            display: grid;
            grid-template-columns: 2fr 1.5fr 120px;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: var(--border-w) solid var(--black);
            transition: 0.15s;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--green-light);
        }

        .history-item .name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .history-item .date {
            font-weight: 600;
            opacity: 0.7;
            font-size: 0.95rem;
        }

        .history-item .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .history-empty {
            padding: 40px 24px;
            text-align: center;
            font-weight: 600;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .footer {
            padding: 24px 0;
            background: var(--white);
            border-top: var(--border-w) solid var(--black);
            flex-shrink: 0;
        }

        .footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer p {
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--black);
            border-bottom: var(--border-w) solid transparent;
            transition: 0.15s;
        }

        .footer-links a:hover {
            border-bottom-color: var(--green);
        }

        @media (max-width: 768px) {
            .history-item {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 16px;
            }
            .history-item .actions {
                justify-content: flex-start;
            }
            .history-header {
                flex-direction: column;
                align-items: stretch;
            }
            .history-header .btn {
                text-align: center;
            }
            .navbar .container {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
            }
            .footer .container {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .history-item {
                padding: 12px;
            }
            .history-item .name {
                font-size: 1rem;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 12px;
            background: var(--white);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border: var(--border-w) solid var(--black);
        }
        ::-webkit-scrollbar-track {
            background: var(--white);
            border-left: var(--border-w) solid var(--black);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-box">ГОСТ</span>
                Отчёт
            </a>
            <div class="nav-links">
                <a href="/lk/generate/">Генерация</a>
            </div>
        </div>
    </nav>

    <main class="history-page">
        <div class="container">
            <div class="history-header">
                <h1>Мои <span>генерации</span></h1>
                <a href="/lk/generate/" class="btn btn-primary">Новая генерация</a>
            </div>

            <div class="history-list" id="historyList">
                <div class="history-empty">Загрузка…</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 ГОСТ Отчёт</p>
            <div class="footer-links">
                <a href="https://alexdenkk.ru">Контакты</a>
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const listContainer = document.getElementById('historyList');

            const apiBaseUrl = 'https://api.gost.alexdenkk.ru';
            const LS_KEYS = {
                access: 'gost_access_token',
                refresh: 'gost_refresh_token',
            };

            function getAccessToken(){ return localStorage.getItem(LS_KEYS.access); }
            function getRefreshToken(){ return localStorage.getItem(LS_KEYS.refresh); }
            function setTokens(access, refresh){
                if (access) localStorage.setItem(LS_KEYS.access, access);
                if (refresh) localStorage.setItem(LS_KEYS.refresh, refresh);
            }
            function clearTokens(){
                localStorage.removeItem(LS_KEYS.access);
                localStorage.removeItem(LS_KEYS.refresh);
            }

            async function refreshTokensOnce(){
                const refreshToken = getRefreshToken();
                if (!refreshToken) throw new Error('no refresh token');

                const res = await fetch(apiBaseUrl + '/user/refresh/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken })
                });

                if (!res.ok) throw new Error('refresh failed');

                const data = await res.json();
                setTokens(data.access_token, data.refresh_token);
                return data;
            }

            let refreshTimer = null;
            function startRefreshLoop(){
                if (refreshTimer) return;
                if (getRefreshToken()) {
                    refreshTimer = setInterval(() => {
                        refreshTokensOnce().catch(() => {
                            clearTokens();
                            window.location.href = '/auth/';
                        });
                    }, 60000);
                }
            }

            async function checkAuthOrRedirect(){
                const accessToken = getAccessToken();
                if (!accessToken) {
                    window.location.href = '/auth/';
                    return false;
                }

                try {
                    const res = await fetch(apiBaseUrl + '/user/self/', {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });

                    if (!res.ok || res.status === 403) {
                        clearTokens();
                        window.location.href = '/auth/';
                        return false;
                    }

                    return true;
                } catch (e) {
                    clearTokens();
                    window.location.href = '/auth/';
                    return false;
                }
            }

            async function apiRequest(path, opts = {}){
                const accessToken = getAccessToken();
                const headers = new Headers(opts.headers || {});
                headers.set('Content-Type', headers.get('Content-Type') || 'application/json');
                if (accessToken) headers.set('Authorization', 'Bearer ' + accessToken);

                const res = await fetch(apiBaseUrl + path, { ...opts, headers });

                if (res.status === 403) {
                    try {
                        await refreshTokensOnce();
                        const retryAccess = getAccessToken();
                        const retryHeaders = new Headers(opts.headers || {});
                        retryHeaders.set('Content-Type', retryHeaders.get('Content-Type') || 'application/json');
                        if (retryAccess) retryHeaders.set('Authorization', 'Bearer ' + retryAccess);
                        return await fetch(apiBaseUrl + path, { ...opts, headers: retryHeaders });
                    } catch (e) {
                        clearTokens();
                        window.location.href = 'auth.html';
                        throw e;
                    }
                }

                return res;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function getDisplayName(lab){
                return lab.lab_title || lab.department || lab.professor || 'Генерация';
            }

            function renderList(labs) {
                if (!labs || labs.length === 0) {
                    listContainer.innerHTML = `<div class="history-empty">Нет сохранённых генераций</div>`;
                    return;
                }

                let html = '';
                labs.forEach(lab => {
                    const id = lab.id;
                    const filename = lab.filename;
                    const name = getDisplayName(lab);
                    const date = lab.date || '';

                    html += `
                        <div class="history-item" data-id="${escapeHtml(id)}" data-filename="${escapeHtml(filename)}">
                            <div class="name">${escapeHtml(name)}</div>
                            <div class="date">${escapeHtml(date)}</div>
                            <div class="actions">
                                <button class="icon-btn" data-action="download" title="Скачать PDF">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="7 10 12 15 17 10" />
                                        <line x1="12" y1="15" x2="12" y2="3" />
                                    </svg>
                                </button>
                                <button class="icon-btn danger" data-action="delete" title="Удалить">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6" />
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                        <line x1="10" y1="11" x2="10" y2="17" />
                                        <line x1="14" y1="11" x2="14" y2="17" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

                listContainer.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(){
                        const item = this.closest('.history-item');
                        const id = item.dataset.id;
                        deleteGeneration(id);
                    });
                });

                listContainer.querySelectorAll('[data-action="download"]').forEach(btn => {
                    btn.addEventListener('click', function(){
                        const item = this.closest('.history-item');
                        const filename = item.dataset.filename;
                        if (!filename) return;
                        window.open(apiBaseUrl + '/files/' + encodeURIComponent(filename) + ".pdf", '_blank');
                    });
                });
            }

            async function fetchLabs(){
                const res = await apiRequest('/lab/self/', { method: 'GET' });
                if (!res.ok) {
                    const data = await res.json().catch(()=>null);
                    alert(data && data.error ? data.error : 'Ошибка загрузки списка');
                    return;
                }

                const labs = await res.json();
                renderList(labs);
            }

            async function deleteGeneration(id) {
                if (!id) return;
                if (!confirm('Удалить эту генерацию?')) return;

                try {
                    await apiRequest('/lab/' + encodeURIComponent(id) + '/', { method: 'DELETE' });
                    await fetchLabs();
                } catch (e) {
                    alert('Ошибка удаления');
                }
            }

            (async function init() {
                const ok = await checkAuthOrRedirect();
                if (!ok) return;

                startRefreshLoop();
                await fetchLabs();
            })();
        })();
    </script>
</body>
</html>
